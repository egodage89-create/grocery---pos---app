workflows:
  android-workflow:
    name: Android APK Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Create Android project with Full POS Features
        script: |
          flutter create --platforms=android --org com.example .
          flutter pub add sqflite path mobile_scanner pdf printing intl

          # Add Camera permission to AndroidManifest.xml
          python3 -c "
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r') as f:
              content = f.read()
          if 'android.permission.CAMERA' not in content:
              content = content.replace('<application', '<uses-permission android:name=\"android.permission.CAMERA\"/>\n    <application')
              with open(path, 'w') as f:
                  f.write(content)
          "

          mkdir -p lib
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:sqflite/sqflite.dart';
          import 'package:path/path.dart' as p;
          import 'package:mobile_scanner/mobile_scanner.dart';
          import 'package:pdf/pdf.dart';
          import 'package:pdf/widgets.dart' as pw;
          import 'package:printing/printing.dart';
          import 'package:intl/intl.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const GroceryPosApp());
          }

          class GroceryPosApp extends StatelessWidget {
            const GroceryPosApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Grocery POS',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(seedColor: Colors.deepPurple),
                  useMaterial3: true,
                ),
                home: const MainNavigationScreen(),
              );
            }
          }

          class Product {
            final int? id;
            final String name;
            final double price;
            final int stock;
            final String barcode;
            final String icon;

            Product({
              this.id,
              required this.name,
              required this.price,
              required this.stock,
              required this.barcode,
              required this.icon,
            });

            Map<String, dynamic> toMap() {
              return {
                'id': id,
                'name': name,
                'price': price,
                'stock': stock,
                'barcode': barcode,
                'icon': icon,
              };
            }

            factory Product.fromMap(Map<String, dynamic> map) {
              return Product(
                id: map['id'],
                name: map['name'],
                price: (map['price'] as num).toDouble(),
                stock: map['stock'],
                barcode: map['barcode'] ?? '',
                icon: map['icon'] ?? '📦',
              );
            }
          }

          class DatabaseHelper {
            static final DatabaseHelper instance = DatabaseHelper._init();
            static Database? _database;

            DatabaseHelper._init();

            Future<Database> get database async {
              if (_database != null) return _database!;
              _database = await _initDB('grocery_pos.db');
              return _database!;
            }

            Future<Database> _initDB(String filePath) async {
              final dbPath = await getDatabasesPath();
              final path = p.join(dbPath, filePath);

              return await openDatabase(
                path,
                version: 2,
                onCreate: _createDB,
                onUpgrade: (db, oldVersion, newVersion) async {
                  if (oldVersion < 2) {
                    await db.execute('''
                      CREATE TABLE sales (
                        id INTEGER PRIMARY KEY AUTOINCREMENT,
                        total_amount REAL NOT NULL,
                        total_items INTEGER NOT NULL,
                        created_at TEXT NOT NULL
                      )
                    ''');
                  }
                },
              );
            }

            Future _createDB(Database db, int version) async {
              await db.execute('''
                CREATE TABLE products (
                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                  name TEXT NOT NULL,
                  price REAL NOT NULL,
                  stock INTEGER NOT NULL,
                  barcode TEXT,
                  icon TEXT
                )
              ''');

              await db.execute('''
                CREATE TABLE sales (
                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                  total_amount REAL NOT NULL,
                  total_items INTEGER NOT NULL,
                  created_at TEXT NOT NULL
                )
              ''');

              await db.insert('products', {'name': 'සහල් (Rice) 1kg', 'price': 220.0, 'stock': 50, 'barcode': '1001', 'icon': '🌾'});
              await db.insert('products', {'name': 'සීනි (Sugar) 1kg', 'price': 280.0, 'stock': 30, 'barcode': '1002', 'icon': '🍬'});
              await db.insert('products', {'name': 'පිටි කිරි (Milk) 400g', 'price': 1050.0, 'stock': 20, 'barcode': '1003', 'icon': '🥛'});
            }

            Future<List<Product>> getAllProducts() async {
              final db = await instance.database;
              final result = await db.query('products', orderBy: 'id DESC');
              return result.map((json) => Product.fromMap(json)).toList();
            }

            Future<int> insertProduct(Product product) async {
              final db = await instance.database;
              return await db.insert('products', product.toMap());
            }

            Future<int> updateProduct(Product product) async {
              final db = await instance.database;
              return await db.update('products', product.toMap(), where: 'id = ?', whereArgs: [product.id]);
            }

            Future<int> deleteProduct(int id) async {
              final db = await instance.database;
              return await db.delete('products', where: 'id = ?', whereArgs: [id]);
            }

            Future<void> recordSale(double totalAmount, int totalItems, Map<Product, int> cartItems) async {
              final db = await instance.database;
              final now = DateTime.now().toIso8601String();

              await db.insert('sales', {
                'total_amount': totalAmount,
                'total_items': totalItems,
                'created_at': now,
              });

              for (var entry in cartItems.entries) {
                await db.rawUpdate(
                  'UPDATE products SET stock = stock - ? WHERE id = ?',
                  [entry.value, entry.key.id],
                );
              }
            }

            Future<List<Map<String, dynamic>>> getSalesHistory() async {
              final db = await instance.database;
              return await db.query('sales', orderBy: 'id DESC');
            }
          }

          class MainNavigationScreen extends StatefulWidget {
            const MainNavigationScreen({super.key});

            @override
            State<MainNavigationScreen> createState() => _MainNavigationScreenState();
          }

          class _MainNavigationScreenState extends State<MainNavigationScreen> {
            int _currentIndex = 0;

            final List<Widget> _screens = [
              const PosSaleScreen(),
              const ProductAdminScreen(),
              const SalesReportScreen(),
            ];

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: _screens[_currentIndex],
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: _currentIndex,
                  onTap: (index) => setState(() => _currentIndex = index),
                  selectedItemColor: Colors.deepPurple,
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.point_of_sale), label: 'POS විකුණුම්'),
                    BottomNavigationBarItem(icon: Icon(Icons.inventory), label: 'භාණ්ඩ කළමනාකරණය'),
                    BottomNavigationBarItem(icon: Icon(Icons.bar_chart), label: 'අලෙවි වාර්තා'),
                  ],
                ),
              );
            }
          }

          class BarcodeScannerScreen extends StatelessWidget {
            const BarcodeScannerScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Barcode Scan කරන්න'),
                  backgroundColor: Colors.deepPurple,
                  foregroundColor: Colors.white,
                ),
                body: MobileScanner(
                  onDetect: (capture) {
                    final List<Barcode> barcodes = capture.barcodes;
                    if (barcodes.isNotEmpty && barcodes.first.rawValue != null) {
                      final String code = barcodes.first.rawValue!;
                      Navigator.pop(context, code);
                    }
                  },
                ),
              );
            }
          }

          class PosSaleScreen extends StatefulWidget {
            const PosSaleScreen({super.key});

            @override
            State<PosSaleScreen> createState() => _PosSaleScreenState();
          }

          class _PosSaleScreenState extends State<PosSaleScreen> {
            List<Product> _products = [];
            final Map<Product, int> _cart = {};
            bool _isLoading = true;

            @override
            void initState() {
              super.initState();
              _loadProducts();
            }

            Future<void> _loadProducts() async {
              setState(() => _isLoading = true);
              final products = await DatabaseHelper.instance.getAllProducts();
              setState(() {
                _products = products;
                _isLoading = false;
              });
            }

            void _addToCart(Product product) {
              final currentQty = _cart[product] ?? 0;
              if (currentQty < product.stock) {
                setState(() {
                  _cart[product] = currentQty + 1;
                });
              } else {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('තොග සීමාව ඉක්මවා ඇත!')),
                );
              }
            }

            void _removeFromCart(Product product) {
              final currentQty = _cart[product];
              if (currentQty != null) {
                setState(() {
                  if (currentQty > 1) {
                    _cart[product] = currentQty - 1;
                  } else {
                    _cart.remove(product);
                  }
                });
              }
            }

            Future<void> _scanBarcodeAndAddToCart() async {
              final String? barcode = await Navigator.push(
                context,
                MaterialPageRoute(builder: (context) => const BarcodeScannerScreen()),
              );

              if (barcode != null && barcode.isNotEmpty) {
                try {
                  final product = _products.firstWhere((p) => p.barcode == barcode);
                  _addToCart(product);
                  if (mounted) {
                    ScaffoldMessenger.of(context).showSnackBar(
                      SnackBar(content: Text('${product.name} Cart එකට එකතු කළා!')),
                    );
                  }
                } catch (e) {
                  if (mounted) {
                    ScaffoldMessenger.of(context).showSnackBar(
                      SnackBar(content: Text('Barcode ($barcode) හමු නොවුණි!')),
                    );
                  }
                }
              }
            }

            double get _totalPrice {
              double total = 0;
              _cart.forEach((product, qty) {
                total += product.price * qty;
              });
              return total;
            }

            int get _totalItems {
              int count = 0;
              _cart.forEach((_, qty) => count += qty);
              return count;
            }

            Future<void> _printReceiptAndSave() async {
              final pdf = pw.Document();
              final dateStr = DateFormat('yyyy-MM-dd HH:mm').format(DateTime.now());

              pdf.addPage(
                pw.Page(
                  pageFormat: PdfPageFormat.roll80,
                  build: (pw.Context context) {
                    return pw.Column(
                      crossAxisAlignment: pw.CrossAxisAlignment.start,
                      children: [
                        pw.Center(
                          child: pw.Text('GROCERY POS STORE', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 16)),
                        ),
                        pw.SizedBox(height: 4),
                        pw.Text('Date: $dateStr', style: const pw.TextStyle(fontSize: 10)),
                        pw.Divider(),
                        ..._cart.entries.map((e) => pw.Padding(
                              padding: const pw.EdgeInsets.symmetric(vertical: 2),
                              child: pw.Row(
                                mainAxisAlignment: pw.MainAxisAlignment.spaceBetween,
                                children: [
                                  pw.Text('${e.key.name} x${e.value}', style: const pw.TextStyle(fontSize: 10)),
                                  pw.Text('LKR ${(e.key.price * e.value).toStringAsFixed(2)}', style: const pw.TextStyle(fontSize: 10)),
                                ],
                              ),
                            )),
                        pw.Divider(),
                        pw.Row(
                          mainAxisAlignment: pw.MainAxisAlignment.spaceBetween,
                          children: [
                            pw.Text('TOTAL:', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 12)),
                            pw.Text('LKR ${_totalPrice.toStringAsFixed(2)}', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 12)),
                          ],
                        ),
                        pw.SizedBox(height: 10),
                        pw.Center(child: pw.Text('Thank You! Come Again.', style: const pw.TextStyle(fontSize: 10))),
                      ],
                    );
                  },
                ),
              );

              await DatabaseHelper.instance.recordSale(_totalPrice, _totalItems, _cart);
              setState(() => _cart.clear());
              await _loadProducts();

              await Printing.layoutPdf(onLayout: (PdfPageFormat format) async => pdf.save());
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('POS Sales'),
                  backgroundColor: Colors.deepPurple,
                  foregroundColor: Colors.white,
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.qr_code_scanner, size: 28),
                      onPressed: _scanBarcodeAndAddToCart,
                    ),
                    IconButton(
                      icon: const Icon(Icons.refresh),
                      onPressed: _loadProducts,
                    )
                  ],
                ),
                body: _isLoading
                    ? const Center(child: CircularProgressIndicator())
                    : Column(
                        children: [
                          Expanded(
                            child: ListView.builder(
                              itemCount: _products.length,
                              itemBuilder: (context, index) {
                                final product = _products[index];
                                final qty = _cart[product] ?? 0;

                                return Card(
                                  margin: const EdgeInsets.symmetric(horizontal: 10, vertical: 5),
                                  child: ListTile(
                                    leading: Text(product.icon, style: const TextStyle(fontSize: 28)),
                                    title: Text(product.name, style: const TextStyle(fontWeight: FontWeight.bold)),
                                    subtitle: Text('රු. ${product.price.toStringAsFixed(2)} | තොගය: ${product.stock}'),
                                    trailing: Row(
                                      mainAxisSize: MainAxisSize.min,
                                      children: [
                                        if (qty > 0) ...[
                                          IconButton(
                                            icon: const Icon(Icons.remove_circle_outline, color: Colors.red),
                                            onPressed: () => _removeFromCart(product),
                                          ),
                                          Text('$qty', style: const TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                                        ],
                                        IconButton(
                                          icon: const Icon(Icons.add_circle_outline, color: Colors.green),
                                          onPressed: () => _addToCart(product),
                                        ),
                                      ],
                                    ),
                                  ),
                                );
                              },
                            ),
                          ),
                          Container(
                            padding: const EdgeInsets.all(16),
                            decoration: BoxDecoration(
                              color: Colors.deepPurple.shade50,
                              boxShadow: [
                                BoxShadow(color: Colors.black.withOpacity(0.1), blurRadius: 4, offset: const Offset(0, -2)),
                              ],
                            ),
                            child: Row(
                              mainAxisAlignment: MainAxisAlignment.spaceBetween,
                              children: [
                                Column(
                                  crossAxisAlignment: CrossAxisAlignment.start,
                                  children: [
                                    Text('භාණ්ඩ ගණන: $_totalItems', style: const TextStyle(fontSize: 14)),
                                    Text(
                                      'එකතුව: රු. ${_totalPrice.toStringAsFixed(2)}',
                                      style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.deepPurple),
                                    ),
                                  ],
                                ),
                                ElevatedButton.icon(
                                  style: ElevatedButton.styleFrom(
                                    backgroundColor: Colors.deepPurple,
                                    foregroundColor: Colors.white,
                                    padding: const EdgeInsets.symmetric(horizontal: 20, vertical: 12),
                                  ),
                                  onPressed: _totalItems == 0 ? null : _printReceiptAndSave,
                                  icon: const Icon(Icons.print),
                                  label: const Text('Bill & Print'),
                                ),
                              ],
                            ),
                          ),
                        ],
                      ),
              );
            }
          }

          class ProductAdminScreen extends StatefulWidget {
            const ProductAdminScreen({super.key});

            @override
            State<ProductAdminScreen> createState() => _ProductAdminScreenState();
          }

          class _ProductAdminScreenState extends State<ProductAdminScreen> {
            List<Product> _products = [];
            bool _isLoading = true;

            @override
            void initState() {
              super.initState();
              _loadProducts();
            }

            Future<void> _loadProducts() async {
              setState(() => _isLoading = true);
              final products = await DatabaseHelper.instance.getAllProducts();
              setState(() {
                _products = products;
                _isLoading = false;
              });
            }

            void _showProductForm({Product? product}) {
              final nameController = TextEditingController(text: product?.name ?? '');
              final priceController = TextEditingController(text: product != null ? product.price.toString() : '');
              final stockController = TextEditingController(text: product != null ? product.stock.toString() : '');
              final barcodeController = TextEditingController(text: product?.barcode ?? '');
              final iconController = TextEditingController(text: product?.icon ?? '📦');

              showDialog(
                context: context,
                builder: (context) => AlertDialog(
                  title: Text(product == null ? 'අලුත් භාණ්ඩයක් එක් කරන්න' : 'භාණ්ඩය සංස්කරණය කරන්න'),
                  content: SingleChildScrollView(
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        TextField(controller: nameController, decoration: const InputDecoration(labelText: 'භාණ්ඩයේ නම')),
                        TextField(controller: priceController, decoration: const InputDecoration(labelText: 'මිල (රු.)'), keyboardType: TextInputType.number),
                        TextField(controller: stockController, decoration: const InputDecoration(labelText: 'තොග ප්‍රමාණය'), keyboardType: TextInputType.number),
                        Row(
                          children: [
                            Expanded(
                              child: TextField(controller: barcodeController, decoration: const InputDecoration(labelText: 'Barcode අංකය')),
                            ),
                            IconButton(
                              icon: const Icon(Icons.qr_code_scanner, color: Colors.deepPurple),
                              onPressed: () async {
                                final String? code = await Navigator.push(
                                  context,
                                  MaterialPageRoute(builder: (context) => const BarcodeScannerScreen()),
                                );
                                if (code != null) {
                                  barcodeController.text = code;
                                }
                              },
                            ),
                          ],
                        ),
                        TextField(controller: iconController, decoration: const InputDecoration(labelText: 'Emoji Icon')),
                      ],
                    ),
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(context), child: const Text('අවලංගුයි')),
                    ElevatedButton(
                      onPressed: () async {
                        final name = nameController.text.trim();
                        final price = double.tryParse(priceController.text) ?? 0.0;
                        final stock = int.tryParse(stockController.text) ?? 0;
                        final barcode = barcodeController.text.trim();
                        final icon = iconController.text.trim();

                        if (name.isNotEmpty && price > 0) {
                          final newProduct = Product(
                            id: product?.id,
                            name: name,
                            price: price,
                            stock: stock,
                            barcode: barcode,
                            icon: icon.isEmpty ? '📦' : icon,
                          );

                          if (product == null) {
                            await DatabaseHelper.instance.insertProduct(newProduct);
                          } else {
                            await DatabaseHelper.instance.updateProduct(newProduct);
                          }

                          Navigator.pop(context);
                          _loadProducts();
                        }
                      },
                      child: const Text('සුරකින්න'),
                    ),
                  ],
                ),
              );
            }

            Future<void> _deleteProduct(int id) async {
              await DatabaseHelper.instance.deleteProduct(id);
              _loadProducts();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Product Inventory'),
                  backgroundColor: Colors.deepPurple,
                  foregroundColor: Colors.white,
                ),
                body: _isLoading
                    ? const Center(child: CircularProgressIndicator())
                    : ListView.builder(
                        itemCount: _products.length,
                        itemBuilder: (context, index) {
                          final product = _products[index];
                          return Card(
                            margin: const EdgeInsets.symmetric(horizontal: 10, vertical: 5),
                            child: ListTile(
                              leading: Text(product.icon, style: const TextStyle(fontSize: 28)),
                              title: Text(product.name, style: const TextStyle(fontWeight: FontWeight.bold)),
                              subtitle: Text('මිල: රු. ${product.price.toStringAsFixed(2)} | තොගය: ${product.stock} | Barcode: ${product.barcode}'),
                              trailing: Row(
                                mainAxisSize: MainAxisSize.min,
                                children: [
                                  IconButton(
                                    icon: const Icon(Icons.edit, color: Colors.blue),
                                    onPressed: () => _showProductForm(product: product),
                                  ),
                                  IconButton(
                                    icon: const Icon(Icons.delete, color: Colors.red),
                                    onPressed: () => _deleteProduct(product.id!),
                                  ),
                                ],
                              ),
                            ),
                          );
                        },
                      ),
                floatingActionButton: FloatingActionButton.extended(
                  onPressed: () => _showProductForm(),
                  backgroundColor: Colors.deepPurple,
                  foregroundColor: Colors.white,
                  icon: const Icon(Icons.add),
                  label: const Text('අලුත් භාණ්ඩයක්'),
                ),
              );
            }
          }

          class SalesReportScreen extends StatefulWidget {
            const SalesReportScreen({super.key});

            @override
            State<SalesReportScreen> createState() => _SalesReportScreenState();
          }

          class _SalesReportScreenState extends State<SalesReportScreen> {
            List<Map<String, dynamic>> _sales = [];
            bool _isLoading = true;

            @override
            void initState() {
              super.initState();
              _loadSales();
            }

            Future<void> _loadSales() async {
              setState(() => _isLoading = true);
              final sales = await DatabaseHelper.instance.getSalesHistory();
              setState(() {
                _sales = sales;
                _isLoading = false;
              });
            }

            double get _totalRevenue {
              double total = 0;
              for (var s in _sales) {
                total += (s['total_amount'] as num).toDouble();
              }
              return total;
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('අලෙවි වාර්තා (Sales Reports)'),
                  backgroundColor: Colors.deepPurple,
                  foregroundColor: Colors.white,
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.refresh),
                      onPressed: _loadSales,
                    )
                  ],
                ),
                body: _isLoading
                    ? const Center(child: CircularProgressIndicator())
                    : Column(
                        children: [
                          Container(
                            margin: const EdgeInsets.all(12),
                            padding: const EdgeInsets.all(16),
                            decoration: BoxDecoration(
                              color: Colors.deepPurple,
                              borderRadius: BorderRadius.circular(12),
                            ),
                            child: Row(
                              mainAxisAlignment: MainAxisAlignment.spaceBetween,
                              children: [
                                Column(
                                  crossAxisAlignment: CrossAxisAlignment.start,
                                  children: [
                                    const Text('මුළු අලෙවි එකතුව', style: TextStyle(color: Colors.white70, fontSize: 14)),
                                    Text('රු. ${_totalRevenue.toStringAsFixed(2)}', style: const TextStyle(color: Colors.white, fontSize: 22, fontWeight: FontWeight.bold)),
                                  ],
                                ),
                                Column(
                                  crossAxisAlignment: CrossAxisAlignment.end,
                                  children: [
                                    const Text('මුළු ගනුදෙනු', style: TextStyle(color: Colors.white70, fontSize: 14)),
                                    Text('${_sales.length}', style: const TextStyle(color: Colors.white, fontSize: 22, fontWeight: FontWeight.bold)),
                                  ],
                                ),
                              ],
                            ),
                          ),
                          Expanded(
                            child: ListView.builder(
                              itemCount: _sales.length,
                              itemBuilder: (context, index) {
                                final sale = _sales[index];
                                final date = DateTime.tryParse(sale['created_at'] ?? '') ?? DateTime.now();
                                final formattedDate = DateFormat('yyyy-MM-dd hh:mm a').format(date);

                                return Card(
                                  margin: const EdgeInsets.symmetric(horizontal: 12, vertical: 4),
                                  child: ListTile(
                                    leading: const CircleAvatar(
                                      backgroundColor: Colors.deepPurple,
                                      child: Icon(Icons.receipt_long, color: Colors.white),
                                    ),
                                    title: Text('රු. ${(sale['total_amount'] as num).toStringAsFixed(2)}', style: const TextStyle(fontWeight: FontWeight.bold)),
                                    subtitle: Text(formattedDate),
                                    trailing: Text('භාණ්ඩ: ${sale['total_items']}', style: const TextStyle(fontSize: 14)),
                                  ),
                                );
                              },
                            ),
                          ),
                        ],
                      ),
              );
            }
          }
          EOF
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
