workflows:
  android-workflow:
    name: Android APK Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Create Android project and restore main
        script: |
          cp lib/main.dart lib/main.dart.bak
          flutter create --platforms=android --org com.example .
          mv lib/main.dart.bak lib/main.dart
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
